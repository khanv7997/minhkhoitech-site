<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài viết | Minh Khôi Tech</title><meta name="description" content="Kiến thức camera, mạng Wi-Fi, hướng dẫn và công trình thực tế từ Minh Khôi Tech."><meta name="theme-color" content="#07131f"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#07131f;--blue:#0978ff;--cyan:#18c8f5;--paper:#f4f7f9;--muted:#65798b;--line:rgba(7,19,31,.13);--max:1240px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}.header{position:sticky;top:0;z-index:20;background:rgba(244,247,249,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav{height:82px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-family:"Space Grotesk"}.navlinks{display:flex;align-items:center;gap:22px;font-size:13px;font-weight:800}.btn{border:1px solid var(--ink);padding:13px 18px;font-size:12px;font-weight:900}.hero{padding:92px 0 56px;background:linear-gradient(130deg,#eff4f8,#fff)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--blue);font-weight:900}.hero h1{font-family:"Space Grotesk";font-size:clamp(55px,9vw,132px);letter-spacing:-.065em;line-height:.84;margin:20px 0}.hero p{max-width:700px;color:var(--muted);font-size:17px}.tools{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin:42px 0 25px}.search{background:#fff;border:1px solid var(--line);padding:15px 16px;width:100%;outline:none}.cats{display:flex;gap:8px;flex-wrap:wrap}.cat{border:1px solid var(--line);background:#fff;padding:11px 14px;font-size:11px;font-weight:900;cursor:pointer}.cat.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:0 0 90px}.card{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;transition:.25s}.card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(6,30,54,.1)}.cover{aspect-ratio:16/10;background:linear-gradient(145deg,#07131f,#0a64ac);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:22px;display:flex;flex-direction:column;flex:1}.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:900;color:#728696}.meta b{color:var(--blue)}h2{font-family:"Space Grotesk";font-size:27px;line-height:1.05;letter-spacing:-.04em;margin:13px 0 10px}.body p{font-size:13px;color:var(--muted);margin:0}.more{margin-top:auto;padding-top:24px;color:var(--blue);font-size:12px;font-weight:900;display:flex;justify-content:space-between}.empty{grid-column:1/-1;background:#fff;padding:34px;border:1px dashed #b8c7d2;color:var(--muted)}.footer{background:var(--ink);color:#9cb0c0;padding:48px 0}.footer .row{display:flex;justify-content:space-between;gap:30px;align-items:center}.footer b{color:#fff}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}.navlinks a:not(.btn){display:none}}@media(max-width:600px){.wrap{width:calc(100% - 24px)}.grid{grid-template-columns:1fr}.hero{padding-top:58px}.hero h1{font-size:18vw}.nav{height:70px}.btn{padding:11px}.footer .row{display:block}}
</style></head><body><header class="header"><div class="wrap nav"><a class="brand" href="/"><span class="mark">MK</span><span>MINH KHÔI TECH</span></a><nav class="navlinks"><a href="/#dich-vu">Dịch vụ</a><a href="/#bang-gia">Bảng giá</a><a href="/bai-viet/">Bài viết</a><a class="btn" href="/#lien-he">Liên hệ</a></nav></div></header><main><section class="hero"><div class="wrap"><div class="eyebrow">Camera · Mạng · Công nghệ</div><h1>Bài viết<br><span style="color:var(--blue)">& công trình.</span></h1><p>Kiến thức thực tế về camera, Wi‑Fi, mạng nội bộ và các công trình Minh Khôi cập nhật trong quá trình làm việc.</p></div></section><section><div class="wrap"><div class="tools"><input class="search" id="search" placeholder="Tìm theo tiêu đề hoặc nội dung..."><div class="cats" id="cats"></div></div><div class="grid" id="grid"><div class="empty">Đang tải bài viết...</div></div></div></section></main><footer class="footer"><div class="wrap row"><div><b>MINH KHÔI TECH</b><div id="footerArea">Camera · Mạng · Công nghệ</div></div><div><a href="/">Trang chủ</a> · <a href="/admin/">Quản trị</a></div></div></footer><script>
const esc=(s='')=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let POSTS=[],CAT='Tất cả';const fmtDate=v=>{try{return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(v))}catch(e){return ''}};function renderCats(){const cs=['Tất cả',...new Set(POSTS.map(x=>x.category).filter(Boolean))];document.getElementById('cats').innerHTML=cs.map(x=>'<button class="cat '+(x===CAT?'active':'')+'" data-cat="'+esc(x)+'">'+esc(x)+'</button>').join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{CAT=b.dataset.cat;renderCats();render()})}function render(){const q=document.getElementById('search').value.trim().toLowerCase();const arr=POSTS.filter(p=>(CAT==='Tất cả'||p.category===CAT)&&(!q||(p.title+' '+p.excerpt+' '+p.category).toLowerCase().includes(q)));document.getElementById('grid').innerHTML=arr.length?arr.map(p=>'<a class="card" href="/bai-viet/'+encodeURIComponent(p.slug)+'"><div class="cover">'+(p.cover_image?'<img src="'+esc(p.cover_image)+'" alt="'+esc(p.cover_alt||p.title)+'" loading="lazy">':'')+'</div><div class="body"><div class="meta"><b>'+esc(p.category||'Bài viết')+'</b><span>•</span><span>'+fmtDate(p.date)+'</span></div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt||'')+'</p><div class="more"><span>Đọc bài viết</span><span>↗</span></div></div></a>').join(''):'<div class="empty">Không tìm thấy bài viết phù hợp.</div>'}async function load(){try{const [pr,sr]=await Promise.all([fetch('/content/posts.json?v='+Date.now()),fetch('/content/site.json?v='+Date.now())]);const pd=await pr.json();POSTS=(pd.posts||[]).filter(x=>x.published!==false).sort((a,b)=>new Date(b.date)-new Date(a.date));renderCats();render();if(sr.ok){const s=await sr.json();document.getElementById('footerArea').textContent=s.footer_area||s.brand_tagline||''}}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Không tải được dữ liệu bài viết.</div>'}}document.getElementById('search').addEventListener('input',render);load();
</script></body></html>
