const esc=(s='')=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const fmtDate=v=>{try{return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(v))}catch(e){return ''}};function inline(s){let x=esc(s);x=x.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+\"[^\"]*\")?\)/g,(m,a,u)=>'<span class="md-image"><img src="'+esc(u)+'" alt="'+esc(a)+'"></span>');x=x.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+|\/[^)]+)\)/g,(m,a,u)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(a)+'</a>');x=x.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');return x}function md(text=''){const lines=String(text).replace(/\r/g,'').split('\n');let out='',list=null,para=[];const flush=()=>{if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}if(list){out+='</'+list+'>';list=null}};for(const raw of lines){const l=raw.trim();if(!l){flush();continue}let m;if((m=l.match(/^(#{2,4})\s+(.+)/))){flush();const n=m[1].length;out+='<h'+n+'>'+inline(m[2])+'</h'+n+'>';continue}if((m=l.match(/^>\s?(.+)/))){flush();out+='<blockquote>'+inline(m[1])+'</blockquote>';continue}if((m=l.match(/^[-*]\s+(.+)/))){if(list!=='ul'){flush();list='ul';out+='<ul>'}out+='<li>'+inline(m[1])+'</li>';continue}if((m=l.match(/^\d+\.\s+(.+)/))){if(list!=='ol'){flush();list='ol';out+='<ol>'}out+='<li>'+inline(m[1])+'</li>';continue}para.push(l)}flush();return out}function setMeta(p){document.title=p.seo_title||p.title+' | Minh Khôi Tech';const desc=p.seo_description||p.excerpt||'';document.querySelector('meta[name="description"]').content=desc;document.querySelector('meta[property="og:title"]').content=p.title;document.querySelector('meta[property="og:description"]').content=desc;if(p.cover_image)document.querySelector('meta[property="og:image"]').content=new URL(p.cover_image,location.origin).href}async function load(){const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');try{const [pr,sr]=await Promise.all([fetch('/content/posts.json?v='+Date.now()),fetch('/content/site.json?v='+Date.now())]);const d=await pr.json(),s=sr.ok?await sr.json():{};const p=(d.posts||[]).find(x=>x.slug===slug&&x.published!==false);if(!p)throw Error('not found');setMeta(p);const phone=(s.phone||'').replace(/\D/g,''),zalo=(s.zalo||s.phone||'').replace(/\D/g,'');document.getElementById('main').innerHTML='<section class="hero"><div class="wrap"><a class="back" href="/bai-viet/">← Tất cả bài viết</a><div class="meta"><b>'+esc(p.category||'Bài viết')+'</b><span>•</span><span>'+fmtDate(p.date)+'</span><span>•</span><span>'+esc(p.author||'Minh Khôi Tech')+'</span></div><h1>'+esc(p.title)+'</h1><p class="excerpt">'+esc(p.excerpt||'')+'</p></div></section><div class="wrap">'+(p.cover_image?'<div class="cover"><img src="'+esc(p.cover_image)+'" alt="'+esc(p.cover_alt||p.title)+'"></div>':'')+'<div class="layout"><article class="content">'+md(p.content||'')+((p.gallery||[]).length?'<div class="gallery">'+p.gallery.map(g=>'<figure><img src="'+esc(g.image)+'" alt="'+esc(g.alt||g.caption||p.title)+'" loading="lazy"><figcaption>'+esc(g.caption||'')+'</figcaption></figure>').join('')+'</div>':'')+'</article><aside class="side"><div class="sidebox"><h3>Cần kiểm tra camera hoặc mạng?</h3><p>Gửi tình trạng đang gặp, Minh Khôi kiểm tra sơ bộ trước và báo phương án phù hợp.</p>'+(phone?'<a class="btn" href="tel:'+phone+'">Gọi ngay</a>':'')+(zalo?'<a class="btn" href="https://zalo.me/'+zalo+'" target="_blank" rel="noopener">Chat Zalo</a>':'')+'<a class="btn" href="/#lien-he">Đặt lịch khảo sát</a></div></aside></div></div>'}catch(e){document.getElementById('main').innerHTML='<div class="wrap notfound"><div class="meta"><b>404</b></div><h1>Không tìm thấy bài viết.</h1><p><a class="btn" href="/bai-viet/">Quay lại danh sách bài viết</a></p></div>'}}load();
